services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: context
      POSTGRES_PASSWORD: local-migrate
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
