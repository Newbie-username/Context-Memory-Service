[project]
name = "context-memory-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "PyJWT[crypto]>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
    "tokenizers>=0.21,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["postgres: PostgreSQL integration test"]

[tool.ruff]
target-version = "py311"
